<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jukebox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="top-bar">
    <img class="jb-logo" id="jbLogo" style="display:none" alt="">
    <div class="channel-tabs" id="channelTabs"></div>
    <span class="sync-badge" id="syncBadge"></span>
  </div>

  <div class="middle">
    <div class="panel panel-left">
      <div class="panel-header">
        <h3 id="leftHeader">Projekte</h3>
        <button class="info-btn" id="leftInfoBtn" style="display:none">i</button>
      </div>
      <div class="panel-body" id="leftBody">
        <div class="empty">Wähle einen Channel</div>
      </div>
    </div>

    <div class="panel panel-right">
      <div class="panel-header">
        <h3 id="rightHeader">Info</h3>
        <button class="info-btn" id="rightInfoBtn" style="display:none">i</button>
      </div>
      <div class="panel-body" id="rightBody">
        <div class="context-display" id="contextDisplay">
          <img id="contextImg" class="context-img" src="" alt="" style="display:none">
          <img id="contextLogo" class="context-logo" src="" alt="" style="display:none">
          <div id="contextMd" class="context-md"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="player-bar" id="playerBar">
    <div class="pb-info">
      <div class="t" id="pbTitle">–</div>
      <div class="a" id="pbArtist">–</div>
    </div>
    <div class="pb-progress">
      <span id="pbTime">0:00</span>
      <input type="range" id="pbProgress" min="0" max="100" value="0" step="0.1">
      <span id="pbDur">0:00</span>
    </div>
    <div class="pb-controls">
      <button id="pbPrev" title="Vorheriger">⏮</button>
      <button id="pbPlay" class="btn-play" title="Start/Stop">▶</button>
      <button id="pbNext" title="Nächster">⏭</button>
      <button id="pbRandom" title="Zufall">🎲</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<audio id="audio"></audio>

<script src="script.js"></script>
</body>
</html>
