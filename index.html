<!DOCTYPE html>
<html lang="en">

<!--
python -m http.server 8000

-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jukebox Kiosk</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-channel="hitproducer">

<div class="kioskApp">
  <!-- Top Header: Channel Toggle & Sync Status -->
  <header class="kioskHeader">
    
      <img id="channelLogo" class="channelLogo" src="" alt="Channel Logo">
      <div class="brandText">
        <span class="kioskLabel">JUKEBOX</span>
        <h1 id="channelTitle">Hitproducer</h1>
      </div>
    </div>

    <div class="channelSwitch" role="tablist" aria-label="Channel Selector">
      <button class="channelBtn active" data-channel="hitproducer">Hitproducer</button>
      <button class="channelBtn" data-channel="khaus">kHaus</button>
    </div>

    <div class="headerActions">
      <button id="channelInfoBtn" class="pillBtn" title="Channel Info">Channel Info</button>
      <div class="syncIndicator" id="syncStatus" title="Auto-syncs every 10 minutes">
        <span class="syncDot"></span>
        <span id="syncText">Live</span>
      </div>
    </div>
  </header>

  <!-- Project Subfolder Navigation Bar -->
  <nav class="projectNav" aria-label="Project Folders">
    <div id="projectTabs" class="projectTabs"></div>
  </nav>

  <!-- Main 13-Inch iPad Split-Screen Workspace -->
  <main class="kioskMain">
    
    <!-- Left Column: Coverflow Player & Audio Controls -->
    <section class="playerStage">
      <div class="swiper-container trackSwiper">
        <div class="swiper-wrapper" id="trackWrapper"></div>
      </div>

      <div class="playerDeck">
        <div class="progressSection">
          <div class="timeRow">
            <span id="currentTime">00:00</span>
            <span id="endTime">00:00</span>
          </div>
          <div class="progressTrack" id="progressTrack">
            <div class="progressFill" id="progressFill"></div>
          </div>
        </div>

        <div class="transportControls">
          <button id="shuffleBtn" class="controlBtn secondary" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button id="prevBtn" class="controlBtn" aria-label="Previous Track" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="playPauseBtn" class="controlBtn primary" aria-label="Play or Pause" title="Play / Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button id="nextBtn" class="controlBtn" aria-label="Next Track" title="Next">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <button id="repeatBtn" class="controlBtn secondary" aria-label="Repeat Track" title="Repeat">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Right Column: Track/Project Description & QR Code -->
    <aside class="infoStage">
      <div class="infoCard">
        <div class="infoHeader">
          <span id="contextBadge" class="contextBadge">TRACK NOTES</span>
          <h2 id="infoTitle">Select a Track</h2>
          <p id="infoSubtitle" class="infoSubtitle"></p>
        </div>

        <div id="infoBody" class="infoBody">
          <p>Loading library from Google Drive...</p>
        </div>

        <!-- Optional QR Code Box (Shown automatically if qr.png exists) -->
        <div id="qrBox" class="qrBox hidden">
          <img id="qrImage" src="" alt="Scan QR Code">
          <div class="qrText">
            <strong>Scan on Your Phone</strong>
            <span>Open link via QR code</span>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <!-- Single Persistent Audio Engine (Never destroyed during 10-min syncs) -->
  <audio id="audioEngine" preload="metadata"></audio>
</div>

<script src="https://cloudflare.com"></script>
<script src="./script.js"></script>
</body>
</html>
